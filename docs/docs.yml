openapi: 3.0.1
info:
  title: Airbean Api
  description: Api Documentaion for Airbean Api
  version: 1.0.0

components:
  schemas:
    Key:
      description: API Key
      type: string
      example: airbean-xxxxx
    UserBody:
      description: User body
      type: object
      properties:
        username:
          type: string
          example: asd123
        password:
          type: string
          example: test123
    Cart:
      description: Cart Patch
      type: object
      properties:
        cartid: 
          type: string
          example: xxxxx
        items: 
          type: array
          items:
            type: object
            properties:
              prodId:
                type: string
                example: xxxxx
              title:
                type: string
                example: Chips
              price:
                type: number
                example: 33
              qty:
                type: number
                example: 2
              _id:
                type: string
                example: xxxxxxxxxxxxxxxxxxxxxxxx
        _id:
          type: string
          example: xxxxxxxxxxxxxxxxxxxxxxxx
    CartBody:
      description: Cart Body
      type: object
      properties:
        prodId:
          type: string
          example: xxxxx
        qty:
          type: number
          example: 2
        cartId:
          type: string
          example: xxxxx
    Menu:
      description: 
    Order:
  responses:
    BadRequestResponse:
      description: Bad request from the client
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Missing or invalid request parameters
    UnauthorizedResponse:
      description: Unauthorized request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Missing or invalid token
    ForbiddenResponse:
      description: Forbidden to perform requested action
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: User not authorized to perform action
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: The requested recource/s was not found
paths:
  /api/keys:
    get:
      tags:
        - API Key
      description: Returns a random API Key
      content:
        application/json:
          schema:
            type: object
              properties:
                success:
                  type: boolean
                  example: true
                key:
                  type: string
                  example: Airbean-xxxxxx
      responses:
        "200":
          description: Returns a random API Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  key:
                    type: string
                    example: Airbean-xxxxxx
        "404":
          $ref: "#/components/responses/NotFoundResponse"